<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | 投資のキホン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="site-header-inner"><a href="index.html" class="brand">投資のキホン</a></div></header>
<main class="legal-main">
<h1>お問い合わせ</h1>
<p>本サイトに関するご質問・ご要望は、下記のフォームからお送りください。</p>

<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contactForm" class="contact-form">
  <input type="hidden" name="form-name" value="contact">
  <p style="display:none;"><label>入力しないでください<input name="bot-field"></label></p>
  <input type="text" name="name" placeholder="お名前" required>
  <input type="email" name="email" placeholder="メールアドレス(返信用)" required>
  <textarea name="message" rows="5" placeholder="お問い合わせ内容" required></textarea>
  <button type="submit">送信する</button>
</form>
<p id="contactStatus" style="font-size:13px; color:var(--muted);" hidden></p>

<p style="margin-top:32px; font-size:12px; color:var(--muted);">
  <a href="index.html">トップに戻る</a> ・ <a href="operator.html">運営者情報</a> ・ <a href="privacy-policy.html">プライバシーポリシー</a>
</p>
</main>
<script>
const form = document.getElementById('contactForm');
const status = document.getElementById('contactStatus');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = form.querySelector('button');
  btn.disabled = true;
  try {
    const res = await fetch('/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(new FormData(form)).toString(),
    });
    if (!res.ok) throw new Error();
    form.hidden = true;
    status.textContent = '送信したよ。ありがとう!';
    status.hidden = false;
  } catch {
    status.textContent = '送信に失敗したよ。時間をおいてもう一度試してね。';
    status.hidden = false;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
